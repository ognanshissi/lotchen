<div class="p-6">
  <div class="flex items-center gap-3 mb-6">
    <button
      class="text-gray-500 hover:text-gray-700 text-sm"
      (click)="goBack()"
    >
      ← Retour
    </button>
    <h1 class="text-2xl font-semibold text-gray-900">
      Historique d'exécutions
    </h1>
  </div>

  <!-- Filter tabs -->
  <div class="flex gap-2 mb-4">
    <button
      class="px-3 py-1 rounded-full text-sm font-medium transition-colors"
      [ngClass]="
        filterStatus() === undefined
          ? 'bg-gray-900 text-white'
          : 'bg-gray-100 text-gray-600'
      "
      (click)="setFilter(undefined)"
    >
      Toutes
    </button>
    <button
      class="px-3 py-1 rounded-full text-sm font-medium transition-colors"
      [ngClass]="
        filterStatus() === 'running'
          ? 'bg-gray-900 text-white'
          : 'bg-gray-100 text-gray-600'
      "
      (click)="setFilter('running')"
    >
      En cours
    </button>
    <button
      class="px-3 py-1 rounded-full text-sm font-medium transition-colors"
      [ngClass]="
        filterStatus() === 'completed'
          ? 'bg-gray-900 text-white'
          : 'bg-gray-100 text-gray-600'
      "
      (click)="setFilter('completed')"
    >
      Terminées
    </button>
    <button
      class="px-3 py-1 rounded-full text-sm font-medium transition-colors"
      [ngClass]="
        filterStatus() === 'failed'
          ? 'bg-gray-900 text-white'
          : 'bg-gray-100 text-gray-600'
      "
      (click)="setFilter('failed')"
    >
      Échouées
    </button>
  </div>

  <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
    <div *ngIf="isLoading()" class="p-8 text-center text-gray-500">
      Chargement...
    </div>
    <div
      *ngIf="!isLoading() && executions().length === 0"
      class="p-8 text-center text-gray-500"
    >
      Aucune exécution trouvée.
    </div>

    <table *ngIf="!isLoading() && executions().length > 0" class="w-full">
      <thead class="bg-gray-50 border-b border-gray-200">
        <tr>
          <th
            class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase"
          >
            Entité cible
          </th>
          <th
            class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase"
          >
            Statut
          </th>
          <th
            class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase"
          >
            Déclencheur
          </th>
          <th
            class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase"
          >
            Démarré
          </th>
          <th
            class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase"
          >
            Durée
          </th>
          <th
            class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase"
          >
            Mode
          </th>
          <th class="px-4 py-3"></th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        <tr
          *ngFor="let exec of executions()"
          class="hover:bg-gray-50 cursor-pointer"
          (click)="viewDetail(exec._id)"
        >
          <td class="px-4 py-3 text-sm text-gray-700 font-mono">
            {{ exec.targetEntityId | slice : 0 : 8 }}...
          </td>
          <td class="px-4 py-3">
            <span
              class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
              [ngClass]="getStatusClass(exec.status)"
            >
              {{ getStatusLabel(exec.status) }}
            </span>
          </td>
          <td class="px-4 py-3 text-sm text-gray-600">
            {{ exec.triggerType }}
          </td>
          <td class="px-4 py-3 text-sm text-gray-500">
            {{ exec.createdAt | date : 'dd/MM/yy HH:mm' }}
          </td>
          <td class="px-4 py-3 text-sm text-gray-500">
            {{ getDuration(exec) }}
          </td>
          <td class="px-4 py-3">
            <span
              *ngIf="exec.testMode"
              class="text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full"
              >Test</span
            >
          </td>
          <td class="px-4 py-3 text-right">
            <button
              class="text-xs px-2 py-1 text-gray-600 border border-gray-200 rounded hover:bg-gray-50"
              (click)="viewDetail(exec._id); $event.stopPropagation()"
            >
              Détail
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
