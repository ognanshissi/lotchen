<div
  class="bg-blue-50 border-2 border-blue-200 rounded-xl p-4 flex flex-col gap-3"
>
  <div class="flex items-center gap-2 mb-1">
    <span class="text-xl">⚡</span>
    <span class="font-semibold text-blue-900 text-sm uppercase tracking-wide"
      >Déclencheur</span
    >
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-xs font-medium text-blue-700">Type de déclencheur</label>
    <select
      class="border border-blue-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:border-blue-500"
      [value]="localTrigger().type"
      (change)="setType($any($event.target).value)"
    >
      <option *ngFor="let t of triggerTypes" [value]="t.value">
        {{ t.label }}
      </option>
    </select>
  </div>

  <!-- Config by type -->
  <ng-container [ngSwitch]="localTrigger().type">
    <ng-container *ngSwitchCase="'status_change'">
      <div class="flex gap-3">
        <div class="flex flex-col gap-1 flex-1">
          <label class="text-xs font-medium text-blue-700">De statut</label>
          <select
            class="border border-blue-300 rounded-lg px-3 py-2 text-sm bg-white"
            [value]="getConfig('fromStatus')"
            (change)="setConfig('fromStatus', $any($event.target).value)"
          >
            <option value="">Tous</option>
            <option *ngFor="let s of contactStatuses" [value]="s.value">
              {{ s.label }}
            </option>
          </select>
        </div>
        <div class="flex flex-col gap-1 flex-1">
          <label class="text-xs font-medium text-blue-700">Vers statut</label>
          <select
            class="border border-blue-300 rounded-lg px-3 py-2 text-sm bg-white"
            [value]="getConfig('toStatus')"
            (change)="setConfig('toStatus', $any($event.target).value)"
          >
            <option value="">Tous</option>
            <option *ngFor="let s of contactStatuses" [value]="s.value">
              {{ s.label }}
            </option>
          </select>
        </div>
      </div>
    </ng-container>

    <ng-container *ngSwitchCase="'date_based'">
      <div class="flex gap-3">
        <div class="flex flex-col gap-1 flex-1">
          <label class="text-xs font-medium text-blue-700">Champ date</label>
          <input
            class="border border-blue-300 rounded-lg px-3 py-2 text-sm bg-white"
            type="text"
            placeholder="ex: dateOfBirth"
            [value]="getConfig('field')"
            (input)="setConfig('field', $any($event.target).value)"
          />
        </div>
        <div class="flex flex-col gap-1 w-24">
          <label class="text-xs font-medium text-blue-700">Décalage (j)</label>
          <input
            class="border border-blue-300 rounded-lg px-3 py-2 text-sm bg-white"
            type="number"
            [value]="getConfig('offsetDays') || '0'"
            (input)="setConfig('offsetDays', $any($event.target).value)"
          />
        </div>
      </div>
    </ng-container>
  </ng-container>
</div>
