<div
  class="w-60 h-full bg-gray-50 border-r border-gray-200 p-4 flex flex-col gap-4 overflow-y-auto"
>
  <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">
    Composants
  </h3>

  <div *ngFor="let group of paletteGroups" class="flex flex-col gap-2">
    <div class="text-xs font-medium text-gray-500 mb-1">{{ group.title }}</div>
    <div
      *ngFor="let item of group.items"
      class="flex items-center gap-2 px-3 py-2 bg-white border border-gray-200 rounded-lg cursor-grab hover:border-gray-400 hover:shadow-sm transition-all text-sm"
      (click)="addNode($any(item), 0)"
      cdkDrag
    >
      <span>{{ item.icon }}</span>
      <span class="text-gray-700 font-medium">{{ item.label }}</span>
    </div>
  </div>
</div>
