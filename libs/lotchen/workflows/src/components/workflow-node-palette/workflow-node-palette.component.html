<div
  class="w-[200px] z-40 h-full bg-white border-r border-gray-200 flex flex-col overflow-y-auto"
>
  <div class="px-4 py-3 border-b border-gray-100">
    <div
      class="flex items-center gap-2 text-xs font-semibold text-gray-500 uppercase tracking-wider"
    >
      <tas-icon iconName="feather:layers" class="text-gray-400"></tas-icon>
      Composants
    </div>
  </div>

  <div class="p-3 flex flex-col gap-4">
    @for (group of paletteGroups; track group.title) {
    <div class="flex flex-col gap-1.5">
      <div
        class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider px-1"
      >
        {{ group.title }}
      </div>
      @for (item of group.items; track item.actionType) {
      <button
        class="flex items-center gap-2.5 px-3 py-4 mt-3 bg-gray-50 border border-gray-200 rounded-lg cursor-grab hover:bg-white hover:border-primary hover:shadow-sm active:shadow-none transition-all duration-150 text-sm group"
        (click)="addNode($any(item))"
        cdkDrag
      >
        <tas-icon
          [iconName]="item.icon"
          [class]="item.color"
          class="text-sm"
        ></tas-icon>
        <span class="text-gray-700 font-medium">{{ item.label }}</span>
        <tas-icon
          iconName="feather:plus"
          class="ml-auto text-gray-300 opacity-0 group-hover:opacity-100 transition-opacity text-xs"
        ></tas-icon>
      </button>
      }
    </div>
    }
  </div>
</div>
