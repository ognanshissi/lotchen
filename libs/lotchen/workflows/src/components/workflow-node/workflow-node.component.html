<div
  class="workflow-node relative flex items-center gap-3 px-4 py-3 bg-white border rounded-xl cursor-pointer select-none transition-all duration-200 hover:shadow-md"
  [class]="
    selected()
      ? 'border-primary shadow-md ring-2 ring-primary/20'
      : 'border-gray-200 hover:border-gray-300'
  "
  (click)="onClick()"
  cdkDrag
>
  <div
    class="flex items-center justify-center w-9 h-9 rounded-lg shrink-0"
    [class]="accentColor()"
  >
    <tas-icon [iconName]="icon()"></tas-icon>
  </div>
  <div class="flex-1 min-w-0">
    <div
      class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider leading-none mb-1"
    >
      {{ getNodeTypeLabel() }}
    </div>
    <div class="text-sm font-medium text-gray-900 truncate">
      {{ node().label }}
    </div>
  </div>
  <button
    tas-button
    iconButton
    color="neutral"
    size="small"
    class="opacity-0 group-hover:opacity-100 transition-opacity"
    (click)="onDelete($event)"
    title="Supprimer"
  >
    <tas-icon
      iconName="feather:x"
      class="text-gray-400 hover:text-functional-error"
    ></tas-icon>
  </button>
</div>
