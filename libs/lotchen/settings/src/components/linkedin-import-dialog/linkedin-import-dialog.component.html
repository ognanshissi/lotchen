<tas-side-drawer>
  <tas-drawer-title>
    <tas-title>Importer depuis LinkedIn — {{ data.configName }}</tas-title>
  </tas-drawer-title>
  <tas-drawer-content>
    <div class="flex flex-col space-y-4">
      <tas-form-field>
        <tas-label>URL du post LinkedIn</tas-label>
        <input
          tasInput
          type="text"
          [formControl]="postUrlControl"
          placeholder="https://www.linkedin.com/posts/..."
        />
      </tas-form-field>

      <div>
        <div class="flex justify-between items-center mb-2">
          <tas-text class="font-semibold">Commentateurs</tas-text>
          <button tas-outlined-button class="!text-sm" (click)="addCommenter()">
            <tas-icon iconName="feather:plus"></tas-icon>
            Ajouter
          </button>
        </div>

        <table class="w-full text-left text-sm">
          <thead>
            <tr class="border-b border-gray-200">
              <th class="py-2 px-2">Prénom</th>
              <th class="py-2 px-2">Nom</th>
              <th class="py-2 px-2">URL Profil</th>
              <th class="py-2 px-2">Titre</th>
              <th class="py-2 px-2"></th>
            </tr>
          </thead>
          <tbody>
            @for ( commenter of commenters(); track $index; let i = $index ) {
            <tr class="border-b border-gray-100">
              <td class="py-1 px-1">
                <input
                  class="w-full border rounded px-2 py-1 text-sm"
                  [value]="commenter.firstName"
                  (input)="
                    updateCommenter(i, 'firstName', $any($event.target).value)
                  "
                  placeholder="Prénom"
                />
              </td>
              <td class="py-1 px-1">
                <input
                  class="w-full border rounded px-2 py-1 text-sm"
                  [value]="commenter.lastName"
                  (input)="
                    updateCommenter(i, 'lastName', $any($event.target).value)
                  "
                  placeholder="Nom"
                />
              </td>
              <td class="py-1 px-1">
                <input
                  class="w-full border rounded px-2 py-1 text-sm"
                  [value]="commenter.profileUrl"
                  (input)="
                    updateCommenter(i, 'profileUrl', $any($event.target).value)
                  "
                  placeholder="https://linkedin.com/in/..."
                />
              </td>
              <td class="py-1 px-1">
                <input
                  class="w-full border rounded px-2 py-1 text-sm"
                  [value]="commenter.headline"
                  (input)="
                    updateCommenter(i, 'headline', $any($event.target).value)
                  "
                  placeholder="Titre"
                />
              </td>
              <td class="py-1 px-1">
                <button
                  class="text-red-500 hover:text-red-700"
                  (click)="removeCommenter(i)"
                >
                  <tas-icon iconName="feather:x"></tas-icon>
                </button>
              </td>
            </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </tas-drawer-content>
  <tas-drawer-action>
    <button tas-outlined-button closable-drawer>
      <tas-icon iconName="close"></tas-icon>
      Fermer
    </button>
    <button
      tas-raised-button
      color="primary"
      (click)="handleImport()"
      [disabled]="importing()"
    >
      <tas-icon iconName="feather:download"></tas-icon>
      {{ importing() ? 'Importation...' : 'Importer' }}
    </button>
  </tas-drawer-action>
</tas-side-drawer>
