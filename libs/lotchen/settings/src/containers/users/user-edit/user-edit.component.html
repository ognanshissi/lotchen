<button tas-button [routerLink]="['/settings', 'users']">
  <tas-icon iconName="arrow_back"></tas-icon>
  Retour
</button>

<div class="grid grid-cols-4 gap-3">
  <div class="col-span-3">
    <tas-card class="w-full grid grid-cols-6 gap-2 p-4">
      <div class="col-span-2 flex space-x-2">
        <span
          class="h-[80px] w-[80px] border border-slate-400 bg-slate-300 rounded-full flex justify-center items-center font-bold text-2xl"
        >
          J
        </span>
        <div class="">
          <tas-title class="font">
            {{ user()?.profile?.firstName }}
            {{ user()?.profile?.lastName }}
          </tas-title>
          <p>{{ user()?.profile?.contactInfo?.email }}</p>
        </div>
      </div>
      <div class="col-span-1">
        <p class="text-slate-400">Occupation</p>
        <span></span>
      </div>
      <div class="col-span-1">
        <p class="text-slate-400">Contact de travail</p>
        <span>{{
          user()?.profile?.contactInfo?.phoneNumbers?.workNumber?.contact
        }}</span>
      </div>
      <div class="col-span-1">
        <p class="text-slate-400">Numéro de téléphone</p>
      </div>
      <div class="col-span-1">
        <p class="text-slate-400">Dernière connexion</p>
      </div>
    </tas-card>

    <tas-title>Reglage de l'utilisateur</tas-title>
  </div>
</div>
