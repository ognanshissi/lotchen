<tas-card class="p-4">
  <h2 class="text-2xl font-semibold">Aperçu</h2>

  <div>
    <div class="border-b border-gray-300 py-4">
      <span>Niveau de progression du contact</span>

      <div class="flex space-x-2 pt-2">
        @for (step of statusPipeline; track step.value) {
        <span
          class="px-4 py-1 text-white rounded-full uppercase text-sm"
          [class.bg-primary]="contact()?.status === step.value"
          [class.bg-gray-400]="contact()?.status !== step.value"
          >{{ step.label }}</span
        >
        }
      </div>
    </div>

    <div class="grid grid-cols-3 gap-4 mt-4">
      <tas-summary-field
        rawField="lastName"
        label="Nom"
        [editable]="true"
        [value]="contact()?.lastName"
        (fieldSaved)="onFieldSaved($event)"
      />
      <tas-summary-field
        rawField="firstName"
        label="Prénom"
        [editable]="true"
        [value]="contact()?.firstName"
        (fieldSaved)="onFieldSaved($event)"
      />
      <tas-summary-field
        rawField="gender"
        label="Genre"
        [editable]="true"
        [value]="contact()?.gender"
        (fieldSaved)="onFieldSaved($event)"
      />
      <tas-summary-field
        rawField="email"
        label="Email"
        [editable]="true"
        [value]="contact()?.email"
        (fieldSaved)="onFieldSaved($event)"
      />
      <tas-summary-field
        rawField="mobileNumber"
        label="Téléphone mobile"
        [editable]="true"
        [value]="contact()?.mobileNumber"
        (fieldSaved)="onFieldSaved($event)"
      />
      <tas-summary-field
        rawField="phone"
        label="Téléphone fixe"
        [editable]="true"
        [value]="contact()?.phone"
        (fieldSaved)="onFieldSaved($event)"
      />
      <tas-summary-field
        rawField="dateOfBirth"
        label="Date de naissance"
        type="date"
        [editable]="true"
        [value]="contact()?.dateOfBirth"
        (fieldSaved)="onFieldSaved($event)"
      />
      <tas-summary-field
        rawField="jobTitle"
        label="Profession"
        [editable]="true"
        [value]="contact()?.jobTitle"
        (fieldSaved)="onFieldSaved($event)"
      />
      <tas-summary-field
        rawField="source"
        label="Source"
        [editable]="true"
        [value]="contact()?.source"
        (fieldSaved)="onFieldSaved($event)"
      />
      <tas-summary-field
        rawField="companyName"
        label="Entreprise"
        [editable]="true"
        [value]="contact()?.companyName"
        (fieldSaved)="onFieldSaved($event)"
      />
      <tas-summary-field rawField="tags" label="Tags" [value]="tagsDisplay()" />
      <tas-summary-field
        rawField="assignedAgent"
        label="Agent responsable"
        [value]="assignedAgent()"
      />
    </div>
  </div>
</tas-card>
